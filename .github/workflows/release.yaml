name: release

on:
  push:
    tags:
      - '*'
  workflow_call:
    inputs:
      args:
        description: 'Extra arguments to pass to goreleaser'
        default: ''
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      # NOTE: add the qemu action before the buildx action if Dockerfile runs foreign-arch commands.
      # - name: Setup Qemu
      #   uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx for Goreleaser
        uses: docker/setup-buildx-action@v4

      - name: Login to Github container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release with Goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release ${{ inputs.args }} --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

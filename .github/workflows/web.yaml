name: Deploy to GitHub Pages

on:
  push:
    tags:
    - '*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:  # NOTE: This only applies to 'run' steps like make, sed, cp; not to actions.
        working-directory: './tqweb'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'  # must match go.work

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'
        cache: npm
        cache-dependency-path: tqweb/package-lock.json

    - name: Install npm dependencies
      run: npm ci

    - name: Build assets
      run: make assets

    - name: Build WASM
      run: make build

    - name: Change base tag in index.html from / to tq
      run: sed -i 's|<base href="/" />|<base href="/tq/" />|g' index.html

    - name: Copy index.html to 404.html
      run: cp index.html 404.html

    - name: Add .nojekyll
      run: touch .nojekyll

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: tqweb

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
